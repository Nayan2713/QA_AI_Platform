server {
    listen 80;
    server_name 52.144.45.25; # Replace with your domain name or server IP

    # Path to the compiled static assets directory of your built React/Vite application
    root /var/www/QA_AI_Platform/frontend/dist;
    index index.html;

    # SPA Fallback: Routes all unknown paths directly to index.html for React Router handling
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy backend API endpoints to the Gunicorn/Django service
    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy Django static resources (admin dashboard static files)
    location /static/ {
        alias /var/www/QA_AI_Platform/backend/static/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Proxy Django media resources (browser videos, snapshots, logs)
    location /media/ {
        alias /var/www/QA_AI_Platform/backend/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Maximum request size (allows uploading large log zip files or videos)
    client_max_body_size 50M;
}
