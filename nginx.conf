user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: blob: https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net; connect-src 'self' ws: wss: http: https:;" always;

    # Max upload size (important for Playwright video and HAR uploads)
    client_max_body_size 100M;

    upstream django_backend {
        server backend:8000;
    }

    upstream react_frontend {
        server frontend:80;
    }

    # Optional HTTP -> HTTPS redirect (disabled by default until SSL is configured)
    # server {
    #     listen 80;
    #     server_name localhost;
    #     return 301 https://$host$request_uri;
    # }

    server {
        listen 80;
        # listen 443 ssl;
        server_name localhost;

        # SSL configurations (uncomment when certificates are ready)
        # ssl_certificate /etc/nginx/ssl/live/domain.com/fullchain.pem;
        # ssl_certificate_key /etc/nginx/ssl/live/domain.com/privkey.pem;
        # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

        # Frontend Static Files
        location / {
            proxy_pass http://react_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Dedicated Real-Time SSE Events Stream Proxy
        location /api/events/ {
            proxy_pass http://django_backend;
            proxy_http_version 1.1;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_set_header Connection "";
            proxy_set_header X-Accel-Buffering "no";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 24h;
        }

        # Django API Proxy
        location /api/ {
            proxy_pass http://django_backend;
            proxy_http_version 1.1;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # SSE/Websocket support
            proxy_set_header Connection "";
            proxy_set_header X-Accel-Buffering "no";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 24h;
        }

        # Django Admin Panel
        location /nayan_admin/ {
            proxy_pass http://django_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Django Static Files Volume
        location /static/ {
            alias /app/static/;
            expires 7d;
            access_log off;
            add_header Cache-Control "public, no-transform";
        }

        # Django Media Files Volume (Screenshots, Videos, HAR traces)
        location /media/ {
            alias /app/media/;
            expires 7d;
            access_log off;
            add_header Cache-Control "public, no-transform";
        }
    }
}