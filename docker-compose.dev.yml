version: '29.6.1'

services:
  # Expose Postgres to host for local database tools/debugging
  postgres:
    ports:
      - "5432:5432"

  # Expose Redis to host for local inspection/commands
  redis:
    ports:
      - "6379:6379"

  # Django Backend (Dev Server with Hot Reload)
  backend:
    build:
      context: ./backend
      target: base
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - DEBUG=True
      # Enable connecting to host machine services (like Ollama running locally)
      - OLLAMA_API_URL=http://host.docker.internal:11434/api/generate

  # Celery Worker (Dev Mounts)
  celery_worker:
    build:
      context: ./backend
      target: base
    volumes:
      - ./backend:/app
    environment:
      - DEBUG=True
      - OLLAMA_API_URL=http://host.docker.internal:11434/api/generate

  # Celery Beat (Dev Mounts)
  celery_beat:
    build:
      context: ./backend
      target: base
    volumes:
      - ./backend:/app
    environment:
      - DEBUG=True

  # React Frontend (Vite Dev Server with Hot Reload)
  frontend:
    build:
      context: ./frontend
      target: development
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      # Anonymous volume prevents local node_modules from overwriting container node_modules
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost/api/

  # Nginx Dev Configuration (proxies / to Vite dev server, supports HMR upgrade headers)
  nginx:
    volumes:
      - ./nginx.dev.conf:/etc/nginx/nginx.conf:ro
      - ./backend/static:/app/static:ro
      - ./backend/media:/app/media:ro
